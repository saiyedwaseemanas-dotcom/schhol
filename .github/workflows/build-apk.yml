name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Build Web Application
        run: |
          npm run build

      - name: Initialize & Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Make Gradle Executable
        run: |
          cd android
          chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Find & Rename Debug APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/EduTrack-Pro-debug.apk
          echo "APK generated successfully at build-output/EduTrack-Pro-debug.apk"

      - name: Upload Debug APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduTrack-Pro-Android-APK
          path: build-output/EduTrack-Pro-debug.apk
          retention-days: 30

      - name: Create GitHub Release (on main branch push)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: EduTrack Pro Release v1.0.${{ github.run_number }}
          body: |
            ### 📱 EduTrack Pro Android Build
            - **Build Number**: ${{ github.run_number }}
            - **Commit**: ${{ github.sha }}
            - **File**: `EduTrack-Pro-debug.apk`
            
            #### How to Install:
            1. Download `EduTrack-Pro-debug.apk` below.
            2. Open the file on your Android device.
            3. If prompted, allow "Install Unknown Apps" for your browser or file manager.
            4. Tap **Install** and launch EduTrack Pro!
          files: build-output/EduTrack-Pro-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
